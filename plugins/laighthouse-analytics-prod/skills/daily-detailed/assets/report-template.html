<meta charset="UTF-8">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
         background: #f8fafc; color: #1e293b; padding: 24px; }
  .report-wrap { max-width: 1100px; margin: 0 auto; }

  th { background: #f1f5f9; color: #475569; font-weight: 600; padding: 8px 12px;

    body { background: white; padding: 0; }
    button { display: none !important; }
    .card { box-shadow: none; border: 1px solid #e2e8f0; break-inside: avoid; }
    canvas { max-width: 100%; }

<body>
<div class="report-wrap" id="report-content">

  <!-- 헤더: 항상 포함 -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
    <div>
      <h1 style="font-size:20px; font-weight:700;">__REPORT_TITLE__</h1>
      <span style="font-size:13px; color:#64748b; margin-top:4px; display:block;">보고서 기간: __REPORT_DATE_LABEL__</span>
    </div>
    <div style="display:flex; gap:8px;">
      <!-- PDF 저장 -->
      <button onclick="downloadReport()"
        style="padding:8px 14px; background:#3b82f6; border:none; border-radius:8px; font-size:13px; color:white; cursor:pointer; display:flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        PDF 저장
      </button>
    </div>
  </div>

<!--SECTION:s1:BEGIN-->
  <!-- DAILY SECTION 1: 목표 달성 현황 (TARGET ACHIEVEMENT) — 카드 3장은 report_kit.s1_grid_html -->
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">목표 달성 현황 (__S1_MM__월 1일~__S1_MM__월 __S1_DD__일)</div>
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid #e2e8f0; border-radius:8px; overflow:hidden;">
      __S1_GRID_HTML__
    </div>
    __S1_FOOTNOTE_HTML__
  </div>
<!--SECTION:s1:END-->

<!--SECTION:s2:BEGIN-->
  <!-- DAILY SECTION 2: EXECUTIVE SUMMARY -->
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">Executive Summary</div>
    <ul style="padding-left:20px; line-height:1.9; font-size:13px; color:#374151;">
      __S2_ITEMS_HTML__
    </ul>
  </div>
<!--SECTION:s2:END-->

<!--SECTION:s3:BEGIN-->
  <!-- DAILY SECTION 3: 최근 7일 성과 — 매출 있음: 광고비·매출 막대 + ROAS / 매출 없음: 클릭 막대 + CTR -->
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">최근 7일 성과</div>
    <div class="legend" id="daily7dayLegend"></div>
    <div style="position:relative; height:320px;">
      <canvas id="daily7dayChart"></canvas>
    </div>
    <!-- 프로모션 브래킷 오버레이 — 프로모션이 없으면 Script가 이 div를 제거한다. -->
    <div id="daily7dayPromoWrap" style="position:relative; margin-top:4px;"></div>
    __S3_FOOTNOTE_HTML__
  </div>
<!--SECTION:s3:END-->

<!--SECTION:s4:BEGIN-->
  <!-- DAILY SECTION 4: 매체·캠페인·광고그룹·광고 계층 표 (D-1 VS D-0) — LHKit.treeTable -->
  <div class="card" style="margin-bottom:16px;">
    <div class="section-title">매체·캠페인·광고그룹·광고 성과 (__D1_MM__월 __D1_DD__일 vs __D0_MM__월 __D0_DD__일)</div>
    <div id="dailyTree"></div>
  </div>
<!--SECTION:s4:END-->

  <!-- 푸터: 항상 포함 -->
  <div style="text-align:center; font-size:12px; color:#94a3b8; padding:16px 0;">
    Engineered by Laighthouse AI
  </div>

</div>

<script>
__REPORT_KIT_JS__
</script>
<script>
LHKit.configure({ currency: __CURRENCY_JSON__ });

/* ── PDF 저장 (차트 렌더링 완료 후 인쇄) ── */
function downloadReport(){
  // Chart.js 캔버스를 정적 이미지로 교체 후 인쇄 → 원복
  const canvases = document.querySelectorAll('canvas');
  const replacements = [];

  canvases.forEach(canvas => {
    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/png');
    img.style.width = canvas.style.width || canvas.offsetWidth + 'px';
    img.style.height = canvas.style.height || canvas.offsetHeight + 'px';
    img.style.maxWidth = '100%';
    canvas.parentNode.insertBefore(img, canvas);
    canvas.style.display = 'none';
    replacements.push({ canvas, img });
  });

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      replacements.forEach(({ canvas, img }) => {
        canvas.style.display = '';
        img.remove();
      });
    }, 1000);
  }, 300);
}

/* ── Section 3: 최근 7일 성과 혼합 차트 ── */
(function(){
  const spec = __S3_CHART_SPEC_JSON__;   // report_kit.perf_chart_spec
  const promos = __S3_PROMOTIONS_JSON__; // [{title, start_idx, end_idx, range_label}, ...] — 없으면 []
  const chart = LHKit.mixedChart('daily7dayChart', 'daily7dayLegend', spec);
  LHKit.promoBrackets('daily7dayPromoWrap', chart, promos, true);
})();

/* ── Section 4: 계층 표 ── */
(function(){
  const tree = __S4_TREE_JSON__;         // report_kit.build_tree
  LHKit.treeTable('dailyTree', tree, { note: __S4_NOTE_JSON__ });
})();
</script>
</body></html>
