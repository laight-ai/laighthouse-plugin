interface:
  display_name: "미디어믹스 결과 보고서"
  short_description: "월간 미디어믹스 결과를 라이트하우스 웹 결과 화면과 같은 HTML 보고서로 만듭니다."
  brand_color: "#3F8F73"

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "list_media_mix_jobs"
      description: "실행한 미디어믹스 job 목록을 조회합니다(조직에 따라 없을 수 있음)."
    - type: "mcp"
      value: "get_media_mix_job"
      description: "미디어믹스 job 결과(summary)를 조회합니다."
    - type: "mcp"
      value: "list_media_mix_metrics"
      description: "미디어믹스에 쓸 비용·성과 지표 후보를 조회합니다."
    - type: "mcp"
      value: "create_media_mix_job"
      description: "확인받은 조건으로 미디어믹스 job을 새로 실행합니다."
